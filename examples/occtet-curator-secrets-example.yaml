# Example secret for the Occtet Curator Helm chart.
#
# A single secret contains ALL credentials: DB + ORT + Keycloak.
#
# 1. Copy this file, e.g. to occtet-curator-secrets.yaml
# 2. Replace EVERY placeholder value below
# 3. Apply it:
#      kubectl apply -f occtet-curator-secrets.yaml -n curator
#
# NEVER commit the filled-in file. .gitignore already excludes
# secrets.yaml, *-secret.yaml, *.secret.yaml and secrets-backup.yaml.
#
# Generate a strong password with:
#   openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: occtet-curator-secrets
  namespace: curator
  labels:
    app.kubernetes.io/name: occtet-curator
type: Opaque
stringData:
  # Database credentials
  # username/database are used by postgresql.customUser.secretKeys
  username: "curator"
  postgres-password: "CHANGE_ME_DB_PASSWORD"
  database: "curator"

  # ORT (OSS Review Toolkit) credentials
  ort-username: "CHANGE_ME_ORT_USERNAME"
  ort-password: "CHANGE_ME_ORT_PASSWORD"

  # Keycloak credentials
  keycloak-client-id: "CHANGE_ME_KEYCLOAK_CLIENT_ID"
  keycloak-client-secret: "CHANGE_ME_KEYCLOAK_CLIENT_SECRET"

---
