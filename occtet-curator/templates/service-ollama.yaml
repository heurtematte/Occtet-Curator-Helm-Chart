{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "occtet-curator.ollama.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "occtet-curator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
  - port: {{ .Values.ollama.service.port }}
    targetPort: {{ .Values.ollama.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    {{- include "occtet-curator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
