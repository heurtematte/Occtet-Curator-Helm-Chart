## @section Global parameters
global:
  ## @param global.namespace Namespace to deploy all resources
  namespace: curator

## @section Image registry
# imageRegistry: ghcr.io/heurtematte
imageRegistry: ghcr.io/bitsea

## @param imageTag Global image tag override for all services (overrides per-service tags)
# imageTag: "pr-2"
imageTag: "latest"

## @param imagePullPolicy Global imagePullPolicy override for all services (Always, IfNotPresent, Never)
imagePullPolicy: "Always"

## @section Frontend configuration
frontend:
  enabled: true
  name: frontend
  image:
    repository: occtet-frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: curator
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: occtet-curator-tls
    #    hosts:
    #      - occtet-curator.local
  
  ## Environment variables for frontend
  env:
    ## ORT (OSS Review Toolkit) Configuration
    ortTokenUrl: "https://keycloack.occtet.eu/realms/occtet/protocol/openid-connect/token"
    ortBaseUrl: "https://ort-server.occtet.eu"
    # ortUsername: "xxxx"
    # ortPassword: "xxxx"
    ortClientId: "api-access"
    
    ## Keycloak Configuration
    keycloakIssuerUri: "https://keycloack.occtet.eu/realms/occtet"
    keycloakClientId: "api-access"
    keycloakClientSecret: "ortserver-api-access"
    
    ## Frontend Configuration
    frontendBaseUrl: "https://curator.occtet.eu/boc"
    
    ## HTTPS CA Certificates
    httpsCaCertPath: "/cacerts"
    
    springProfilesActive: "live,oidc"
  
  ## Name of existing secret for sensitive env vars
  ## Secret must contain: ort-password, keycloak-client-secret
  ## Secret is created by: make secrets-create
  existingSecret: "occtet-curator-secrets"
  
  ## CA certificates configuration
  caCerts:
    existingSecret: ""
    existingConfigMap: ""
  
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi
  
  volumeMounts:
    - name: project-data
      mountPath: /project_data
    - name: cacerts
      mountPath: /cacerts
      readOnly: true

